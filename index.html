<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Glossary | Side of Kitchen Wisdom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: rgba(10, 10, 10, 0.95);
            --border-default: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            
            /* Mastra-inspired Neon Palette */
            --neon-green: #38b000;
            --neon-purple: #9d4edd;
            --neon-pink: #ff006e;
            --neon-orange: #ff9f1c;
            --neon-blue: #00d2ff;
            
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes borderFlow {
            0% { border-color: var(--neon-green); }
            25% { border-color: var(--neon-purple); }
            50% { border-color: var(--neon-pink); }
            75% { border-color: var(--neon-orange); }
            100% { border-color: var(--neon-green); }
        }

        @keyframes scrollUp {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s var(--ease-out-expo);
            -webkit-font-smoothing: antialiased;
        }

        .top-section {
            min-height: 35vh;
            padding: 40px 20px 30px 20px;
            z-index: 100;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-bottom: 1px solid var(--border-default);
        }

        .library-header-static {
            background-color: var(--bg);
            padding: 30px 20px 10px 20px;
            flex-shrink: 0;
            z-index: 90;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .scroll-area {
            flex: 1;
            padding: 0;
            background-color: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 1200px) {
            body { height: 100vh; overflow: hidden; }
            .top-section { height: 50vh; min-height: 400px; }
        }

        @media (max-width: 1199px) {
            .top-section { min-height: auto; height: auto; padding-top: 40px; padding-bottom: 40px; }
            .scroll-area { height: 400px; flex: none; }
            body { overflow: auto; height: auto; }
            #results { margin-bottom: 20px; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .h1-sub { font-size: 0.9rem; margin-top: 8px; }
            .term-name { font-size: 1.8rem; }
            .explanation-text { font-size: 1rem; }
            .card { padding: 25px; }
            .top-section { padding: 30px 20px; }
            .search-box { margin-top: 20px; }
        }

        .container { max-width: 900px; margin: 0 auto; width: 100%; }

        header { text-align: center; margin-bottom: 20px; }

        header::before {
            content: '👨‍🍳';
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #fff;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .h1-sub {
            font-size: 1rem;
            display: block;
            color: var(--text-secondary);
            font-family: 'Geist Mono', monospace;
            font-weight: 400;
            margin-top: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 12px;
            font-weight: 400;
            opacity: 0.7;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin: 20px auto 15px auto;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-default);
            border-radius: 14px;
            padding: 6px;
            backdrop-filter: blur(40px);
            transition: all 0.4s var(--ease-out-expo);
        }

        .search-box:focus-within {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            font-size: 1rem;
            outline: none;
            background: transparent;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .btn-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; }

        button {
            padding: 10px 28px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-out-expo);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: 'Inter', sans-serif;
        }

        button.main-btn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
        }

        button.roulette-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--border-default);
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        button.main-btn:hover { background: #eeeeee; }
        button.roulette-btn:hover { border-color: rgba(255, 255, 255, 0.3); }

        #results {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
        }

        .card {
            position: relative;
            background: var(--surface);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-default);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 800px;
            max-height: 100%;
            overflow-y: auto;
            animation: slideIn 0.8s var(--ease-out-expo);
            backdrop-filter: blur(20px);
            transition: border-color 1.5s ease;
        }

        .card.is-active {
            animation: slideIn 0.8s var(--ease-out-expo), borderFlow 8s infinite linear;
            border-width: 1.5px;
        }

        .analogy-container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            border-radius: 14px;
            border: 1px solid var(--border-default);
            position: relative;
        }

        .analogy-label {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #fff;
            color: #000;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: 'Geist Mono', monospace;
        }

        .analogy-text {
            font-style: italic;
            color: #fff;
            font-size: 1.05rem;
            line-height: 1.6;
            opacity: 0.95;
        }

        .analogy-text::before {
            content: '🍱 ';
            font-style: normal;
        }

        .source-badge {
            font-size: 0.6rem;
            font-family: 'Geist Mono', monospace;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 15px;
            display: inline-block;
            border: 1px solid var(--border-default);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
        }

        .term-name { font-size: 2.2rem; font-family: 'Playfair Display', serif; margin: 0 0 12px 0; color: white; line-height: 1; letter-spacing: -0.04em; }

        .explanation-text { font-size: 1.05rem; color: var(--text-secondary); line-height: 1.6; max-width: 680px; }

        .library-title {
            text-align: center;
            font-family: 'Geist Mono', monospace;
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin: 0;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.5;
        }

        /* Floating Wall Animation */
        .marquee-viewport {
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .marquee-content {
            display: flex;
            flex-direction: column;
            animation: scrollUp 40s linear infinite;
        }

        .marquee-content:hover {
            animation-play-state: paused;
        }

        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            padding: 20px 0;
        }

        .term-pill {
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s var(--ease-out-expo);
            font-family: 'Geist Mono', monospace;
        }

        .term-pill:hover {
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .loading { text-align: center; padding: 30px; color: #fff; font-family: 'Geist Mono', monospace; font-size: 0.9rem; letter-spacing: 0.25em; text-transform: uppercase; animation: pulseGlow 2.5s infinite; }

        .status-msg {
            padding: 60px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.01);
            border: 1.5px solid var(--border-default);
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            animation: fadeIn 1.5s var(--ease-out-expo), borderFlow 8s infinite linear;
        }
    </style>
</head>
<body>

<div class="top-section">
    <div class="container">
        <header>
            <h1>Tech Glossary <span class="h1-sub">with Kitchen analogy</span></h1>
            <p class="subtitle">An autonomous library that learns as you search</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for any tech term...">
        </div>

        <div class="btn-group">
            <button class="main-btn" onclick="handleSearch()">Search</button>
            <button class="roulette-btn" onclick="handleRoulette()">🎲 Kitchen Roulette</button>
        </div>

        <div id="results">
            <div class="status-msg">
                Enter a term to reveal its hidden recipe...
            </div>
        </div>
    </div>
</div>

<div class="library-header-static">
    <div class="container">
        <h3 class="library-title">Master Library</h3>
    </div>
</div>

<div class="scroll-area">
    <div class="container marquee-viewport">
        <div id="pantryWrapper" class="marquee-content">
            <div id="pantryGrid1" class="term-grid"></div>
            <div id="pantryGrid2" class="term-grid"></div>
        </div>
    </div>
</div>

<script>
    let masterList = [];

    async function updatePantry() {
        try {
            const termsResp = await fetch('/my_terms.json');
            const data = await termsResp.json();
            masterList = Array.isArray(data) ? data : Object.values(data);
            
            const gridContent = masterList.map((t) => `
                <div class="term-pill" onclick="handleSearch('${t.term}')">
                    ${t.term}
                </div>
            `).join('');

            document.getElementById('pantryGrid1').innerHTML = gridContent;
            document.getElementById('pantryGrid2').innerHTML = gridContent;

            // Adjust animation duration based on content length
            const wrapper = document.getElementById('pantryWrapper');
            const duration = Math.max(20, masterList.length * 1.5);
            wrapper.style.animationDuration = `${duration}s`;

        } catch (e) { console.error(e); }
    }

    async function handleRoulette() {
        if (masterList.length === 0) return;
        const randomTerm = masterList[Math.floor(Math.random() * masterList.length)].term;
        document.getElementById('searchInput').value = randomTerm;
        handleSearch(randomTerm);
    }

    async function handleSearch(overrideQuery = null) {
        const query = (overrideQuery || document.getElementById('searchInput').value).trim();
        if (!query) return;

        const resultsDiv = document.getElementById('results');
        const directMatch = masterList.find(t => t.term.toLowerCase() === query.toLowerCase());
        
        if (directMatch) {
            displayResult(directMatch, 'database');
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">Consulting the AI Oracle...</div>';

        try {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await response.json();
            
            if (response.status === 400) {
                resultsDiv.innerHTML = `<div class="status-msg">🔮 ${data.error}</div>`;
                return;
            }
            
            if (data.error) throw new Error(data.error);
            displayResult(data, data.source);
            updatePantry();
        } catch (error) {
            resultsDiv.innerHTML = `<div class="status-msg">📡 Sensei says: ${error.message}</div>`;
        }
    }

    function displayResult(data, source) {
        const resultsDiv = document.getElementById('results');
        const isAI = source !== 'database';
        
        resultsDiv.innerHTML = `
            <div class="card is-active" id="resultCard" style="opacity: 0; transform: translateY(30px);">
                <span class="source-badge">
                    ${isAI ? '✨ AI GENERATED' : '📚 CACHED DATA'}
                </span>
                <div id="resCategory" style="color: var(--text-secondary); font-size: 0.75rem; font-family: 'Geist Mono', monospace; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; opacity: 0;">${data.category}</div>
                <h2 id="resName" class="term-name" style="opacity: 0;">${data.term}</h2>
                <p id="resExp" class="explanation-text" style="opacity: 0;">${data.explanation}</p>
                <div id="resAnalogy" class="analogy-container" style="opacity: 0;">
                    <div class="analogy-label">Kitchen Wisdom</div>
                    <div class="analogy-text">“${data.analogy}”</div>
                </div>
            </div>
        `;

        const card = document.getElementById('resultCard');
        setTimeout(() => { 
            card.style.transition = "all 0.8s var(--ease-out-expo), border-color 1.5s ease";
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";
        }, 50);

        const elements = ['resCategory', 'resName', 'resExp', 'resAnalogy'];
        elements.forEach((id, index) => {
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.transition = "all 0.6s var(--ease-out-expo)";
                    el.style.opacity = "1";
                    el.style.transform = "translateY(0)";
                }
            }, 400 + (index * 150));
        });
    }

    document.getElementById('searchInput').onkeyup = (e) => { if (e.key === 'Enter') handleSearch(); };
    updatePantry();
</script>

</body>
</html>
